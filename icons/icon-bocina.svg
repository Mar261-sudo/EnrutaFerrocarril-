<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Cuerpo bocina -->
  <path d="M8 24 L8 40 L20 40 L20 24 Z" fill="#8b6f47" stroke="#c9a66b" stroke-width="1"/>
