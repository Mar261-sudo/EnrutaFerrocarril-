  <path d="M20 18 L20 46 L52 54 L52 10 Z" fill="#8b6f47" stroke="#c9a66b" stroke-width="1.2"/>
  <!-- Detalle interno -->
  <path d="M20 22 L20 42 L48 50 L48 14 Z" fill="#3d2e28" opacity="0.4"/>
  <!-- Líneas de grabado en el pabellón -->
  <line x1="28" y1="13" x2="28" y2="51" stroke="#c9a66b" stroke-width="0.6" opacity="0.5"/>
  <line x1="36" y1="11" x2="36" y2="53" stroke="#c9a66b" stroke-width="0.6" opacity="0.5"/>
  <line x1="44" y1="11" x2="44" y2="53" stroke="#c9a66b" stroke-width="0.6" opacity="0.5"/>
  <!-- Borde boca bocina -->
  <ellipse cx="52" cy="32" rx="4" ry="22" fill="#3d2e28" stroke="#c9a66b" stroke-width="1.2"/>
  <!-- Soporte -->
  <rect x="5" y="22" width="6" height="20" rx="1" fill="#3d2e28" stroke="#c9a66b" stroke-width="0.8"/>
  <!-- Ondas de sonido -->
  <path d="M56 22 Q62 32 56 42" stroke="#c9a66b" stroke-width="1.2" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M59 18 Q68 32 59 46" stroke="#c9a66b" stroke-width="0.8" fill="none" opacity="0.4" stroke-linecap="round"/>
  <!-- Remaches -->
  <circle cx="11" cy="26" r="1" fill="#c9a66b" opacity="0.7"/>
  <circle cx="11" cy="32" r="1" fill="#c9a66b" opacity="0.7"/>
  <circle cx="11" cy="38" r="1" fill="#c9a66b" opacity="0.7"/>
</svg>
