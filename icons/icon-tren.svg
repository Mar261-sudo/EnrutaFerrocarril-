<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Chimenea -->
  <rect x="14" y="8" width="8" height="12" rx="1" fill="#c9a66b" opacity="0.9"/>
  <rect x="12" y="7" width="12" height="3" rx="1" fill="#c9a66b"/>
  <!-- Humo -->
  <circle cx="18" cy="4" r="2" fill="#8b6f47" opacity="0.5"/>
  <circle cx="21" cy="2" r="1.5" fill="#8b6f47" opacity="0.3"/>
  <!-- Caldera principal -->
  <rect x="10" y="18" width="32" height="16" rx="3" fill="#8b6f47"/>
  <rect x="10" y="18" width="32" height="16" rx="3" stroke="#c9a66b" stroke-width="1"/>
  <!-- Detalle caldera - remaches -->
  <circle cx="14" cy="22" r="1.2" fill="#c9a66b" opacity="0.7"/>
  <circle cx="14" cy="28" r="1.2" fill="#c9a66b" opacity="0.7"/>
  <circle cx="38" cy="22" r="1.2" fill="#c9a66b" opacity="0.7"/>
  <circle cx="38" cy="28" r="1.2" fill="#c9a66b" opacity="0.7"/>
  <!-- Ventana caldera -->
  <circle cx="26" cy="26" r="4" fill="#1a1411" stroke="#c9a66b" stroke-width="1"/>
  <circle cx="26" cy="26" r="2" fill="#c9a66b" opacity="0.3"/>
  <!-- Cabina -->
  <rect x="40" y="14" width="14" height="20" rx="2" fill="#8b6f47" stroke="#c9a66b" stroke-width="1"/>
  <rect x="43" y="17" width="8" height="8" rx="1" fill="#1a1411" stroke="#c9a66b" stroke-width="0.8" opacity="0.9"/>
  <!-- Base/chasis -->
  <rect x="6" y="34" width="52" height="6" rx="1" fill="#3d2e28" stroke="#c9a66b" stroke-width="0.8"/>
  <!-- Ruedas grandes -->
  <circle cx="18" cy="44" r="8" fill="#1a1411" stroke="#c9a66b" stroke-width="1.5"/>
  <circle cx="18" cy="44" r="5" fill="none" stroke="#8b6f47" stroke-width="1"/>
  <circle cx="18" cy="44" r="2" fill="#c9a66b"/>
  <!-- Radios rueda izq -->
  <line x1="18" y1="36" x2="18" y2="52" stroke="#8b6f47" stroke-width="0.8"/>
  <line x1="10" y1="44" x2="26" y2="44" stroke="#8b6f47" stroke-width="0.8"/>
  <line x1="12.3" y1="38.3" x2="23.7" y2="49.7" stroke="#8b6f47" stroke-width="0.8"/>
  <line x1="23.7" y1="38.3" x2="12.3" y2="49.7" stroke="#8b6f47" stroke-width="0.8"/>
  <!-- Rueda mediana -->
  <circle cx="38" cy="44" r="7" fill="#1a1411" stroke="#c9a66b" stroke-width="1.5"/>
  <circle cx="38" cy="44" r="4" fill="none" stroke="#8b6f47" stroke-width="1"/>
  <circle cx="38" cy="44" r="1.8" fill="#c9a66b"/>
  <line x1="38" y1="37" x2="38" y2="51" stroke="#8b6f47" stroke-width="0.8"/>
  <line x1="31" y1="44" x2="45" y2="44" stroke="#8b6f47" stroke-width="0.8"/>
  <!-- Rueda pequeña trasera -->
  <circle cx="52" cy="45" r="5" fill="#1a1411" stroke="#c9a66b" stroke-width="1.2"/>
  <circle cx="52" cy="45" r="2" fill="#c9a66b" opacity="0.6"/>
  <!-- Biela -->
  <line x1="18" y1="44" x2="38" y2="44" stroke="#c9a66b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Colector vapor frontal -->
  <rect x="4" y="24" width="8" height="4" rx="1" fill="#3d2e28" stroke="#c9a66b" stroke-width="0.8"/>
  <rect x="2" y="25" width="4" height="2" rx="0.5" fill="#c9a66b" opacity="0.7"/>
  <!-- Rieles -->
  <line x1="2" y1="54" x2="62" y2="54" stroke="#8b6f47" stroke-width="1.5"/>
  <line x1="2" y1="57" x2="62" y2="57" stroke="#8b6f47" stroke-width="1.5"/>
  <line x1="8"  y1="54" x2="8"  y2="57" stroke="#8b6f47" stroke-width="1"/>
  <line x1="18" y1="54" x2="18" y2="57" stroke="#8b6f47" stroke-width="1"/>
  <line x1="28" y1="54" x2="28" y2="57" stroke="#8b6f47" stroke-width="1"/>
  <line x1="38" y1="54" x2="38" y2="57" stroke="#8b6f47" stroke-width="1"/>
  <line x1="48" y1="54" x2="48" y2="57" stroke="#8b6f47" stroke-width="1"/>
  <line x1="58" y1="54" x2="58" y2="57" stroke="#8b6f47" stroke-width="1"/>
</svg>
